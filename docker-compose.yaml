name: roboshop
services:
  mongodb:
    build: ./mongodb
    image: muddukrishna1505/mongodb:v1  #docker build -t roboshop muddukrishna1505/mongodb:v1
    container_name: mongodb #docker run -d --network roboshop muddukrishna1505/mongodb:v1
  catalogue:
    build: ./catalogue
    image: muddukrishna1505/catalogue:v1
    container_name: catalogue
  user:
    build: ./user
    image: muddukrishna1505/user:v1
    container_name: user
    environment:
      MONGO: true
      REDIS_URL: 'redis://redis:6379'
      MONGO_URL: "mongodb://mongodb:27017/users"
    depends_on:
      - redis
      - mongodb
  cart:
    build: ./cart
    image: muddukrishna1505/cart:v1
    container_name: cart
    environment:
      REDIS_HOST: redis
      CATALOGUE_HOST: catalogue
      CATALOGUE_PORT: 8080
  shipping:
    build: ./shipping
    image: muddukrishna1505/shipping:v1
    container_name: shipping
    environment:
      CART_ENDPOINT: "cart:8080"
      DB_HOST: "mysql"    
    depends_on:
      - mysql
      - cart 
  payment:
    build: ./payment
    image: muddukrishna1505/payment:v1
    container_name: payment
    environment:
      CART_HOST: cart
      CART_PORT: 8080
      USER_HOST: user
      USER_PORT: 8080
      AMQP_HOST: rabbitmq
      AMQP_USER: roboshop
      AMQP_PASS: roboshop123
    depends_on:
    - cart
    - user
    - rabbitmq    
  redis:
    image: redis:7
    container_name: redis  
  mysql:
    build: ./mysql
    image: muddukrishna1505/mysql:v1
    container_name: mysql   
    environment:
      MYSQL_ROOT_PASSWORD: "RoboShop@1"
  rabbitmq:
    image: rabbitmq:3
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "roboshop"
      RABBITMQ_DEFAULT_PASS: "roboshop123"    
  frontend:
    build: ./frontend
    image: muddukrishna1505/frontend:v1
    container_name: frontend
    ports:
    - "80:80"
    depends_on:
    - catalogue
    - user
    - cart
    - shipping  
    - payment
networks:
    default:
      name: roboshop
      driver: bridge
      external: false